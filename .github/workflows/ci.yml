name: AIRegistry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate Registry & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate registry
        run: python scripts/build_registry.py --check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile ai.py scripts/build_registry.py
