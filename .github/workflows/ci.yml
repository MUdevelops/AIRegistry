name: AIRegistry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate registry and indexes
        run: python scripts/build_registry.py --check

      - name: Run tests
        run: python -W error -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile ai.py scripts/build_registry.py

  web:
    name: Website and Worker syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check website/app.js
      - run: node --check cloudflare/worker.js
