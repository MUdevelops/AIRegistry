<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Security model">
  <title>Security model</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".6" stop-color="#0e1228"/><stop offset="1" stop-color="#08192a"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#22c55e"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#22c55e" stop-opacity=".38"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop offset="0" stop-color="#00e5ff" stop-opacity=".25"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7dd3fc" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="128" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="130" fill="url(#bg)"/>
    <rect width="1200" height="130" fill="url(#grid)"/>
    <ellipse cx="92" cy="65" rx="190" ry="110" fill="url(#halo)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1090" cy="40" rx="260" ry="120" fill="url(#halo2)"/>
    <text x="1172" y="106" text-anchor="end" fill="none" stroke="#22c55e" stroke-opacity=".16" stroke-width="1.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="104" font-weight="800">09</text>
    <g fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".55">
      <path d="M760 20H836L852 36H930"/><path d="M1200 96H1118L1100 78H1040"/><path d="M640 122V104L656 88H700"/>
    </g>
    <g fill="#00e5ff" filter="url(#glow)"><circle cx="836" cy="20" r="2.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1118" cy="96" r="2.6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="656" cy="88" r="2.6"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(92 65)" filter="url(#glow)"><clipPath id="sh"><path d="M0 -38L31 -26V0C31 20 15 33 0 40C-15 33 -31 20 -31 0V-26Z"/></clipPath>
<path d="M0 -38L31 -26V0C31 20 15 33 0 40C-15 33 -31 20 -31 0V-26Z" fill="#22c55e" fill-opacity=".14" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
<g clip-path="url(#sh)"><rect x="-34" y="-6" width="68" height="14" fill="url(#beamV)" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 -36;0 40;0 -36" dur="3.2s" repeatCount="indefinite"/></rect></g>
<polyline points="-13,2 -4,12 14,-10" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="40;0;0;40" keyTimes="0;.3;.85;1" dur="3.2s" repeatCount="indefinite"/></polyline></g>
    <path d="M168 26V104" stroke="url(#g)" stroke-width="2" stroke-opacity=".6"/>
    <text x="196" y="44" fill="#22c55e" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="5">SECTION 09</text>
    <text x="195" y="80" fill="url(#gt)" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-.5">Security model</text>
    <text x="196" y="106" fill="#a8b3cf" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing=".6">Untrusted input, verified checksums</text>
    <path d="M24 124H1176" stroke="url(#beam)" stroke-width="2.4" stroke-dasharray="90 1110" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="1200;0;-1200" dur="6s" repeatCount="indefinite"/></path>
    <path d="M24 124H1176" stroke="url(#g)" stroke-opacity=".25" stroke-width="1"/>
    <rect x="1" y="1" width="1198" height="128" rx="20" fill="none" stroke="url(#g)" stroke-opacity=".6" stroke-width="1.5"/>
  </g>
</svg>