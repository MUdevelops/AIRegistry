<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Quick start">
  <title>Quick start</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".6" stop-color="#0e1228"/><stop offset="1" stop-color="#08192a"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#facc15" stop-opacity="0"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#fb923c" stop-opacity=".38"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop offset="0" stop-color="#facc15" stop-opacity=".25"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7dd3fc" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="128" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="130" fill="url(#bg)"/>
    <rect width="1200" height="130" fill="url(#grid)"/>
    <ellipse cx="92" cy="65" rx="190" ry="110" fill="url(#halo)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1090" cy="40" rx="260" ry="120" fill="url(#halo2)"/>
    <text x="1172" y="106" text-anchor="end" fill="none" stroke="#fb923c" stroke-opacity=".16" stroke-width="1.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="104" font-weight="800">03</text>
    <g fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".55">
      <path d="M760 20H836L852 36H930"/><path d="M1200 96H1118L1100 78H1040"/><path d="M640 122V104L656 88H700"/>
    </g>
    <g fill="#facc15" filter="url(#glow)"><circle cx="836" cy="20" r="2.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1118" cy="96" r="2.6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="656" cy="88" r="2.6"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(92 65)" filter="url(#glow)"><rect x="-38" y="-28" width="76" height="58" rx="9" fill="#0b1626" stroke="url(#g)" stroke-width="2.6"/>
<path d="M-38 -14H38" stroke="url(#g)" stroke-opacity=".6"/>
<circle cx="-28" cy="-21" r="2.5" fill="#ff5f57"/><circle cx="-20" cy="-21" r="2.5" fill="#febc2e"/><circle cx="-12" cy="-21" r="2.5" fill="#28c840"/>
<polyline points="-28,-2 -18,6 -28,14" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="-10" y="4" width="0" height="4" rx="2" fill="#facc15"><animate attributeName="width" values="0;30;30;0" keyTimes="0;.4;.85;1" dur="3s" repeatCount="indefinite"/></rect>
<rect x="24" y="1" width="6" height="12" rx="1" fill="#fb923c"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<path d="M30 -42l-10 16h8l-4 14 14 -19h-8z" fill="#facc15" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="1.4s" repeatCount="indefinite"/></path></g>
    <path d="M168 26V104" stroke="url(#g)" stroke-width="2" stroke-opacity=".6"/>
    <text x="196" y="44" fill="#fb923c" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="5">SECTION 03</text>
    <text x="195" y="80" fill="url(#gt)" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-.5">Quick start</text>
    <text x="196" y="106" fill="#a8b3cf" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing=".6">From zero to a working component in minutes</text>
    <path d="M24 124H1176" stroke="url(#beam)" stroke-width="2.4" stroke-dasharray="90 1110" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="1200;0;-1200" dur="6s" repeatCount="indefinite"/></path>
    <path d="M24 124H1176" stroke="url(#g)" stroke-opacity=".25" stroke-width="1"/>
    <rect x="1" y="1" width="1198" height="128" rx="20" fill="none" stroke="url(#g)" stroke-opacity=".6" stroke-width="1.5"/>
  </g>
</svg>