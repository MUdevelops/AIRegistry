<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AIRegistry — Install AI capabilities, not libraries</title>
  <desc id="desc">A futuristic AIRegistry banner with a neon wireframe cube, a glowing cyan-violet title, moving circuit traces, and an animated light sweep.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#10122b"/><stop offset="1" stop-color="#071a28"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#8b5cf6;#22d3ee;#00e5ff" dur="8s" repeatCount="indefinite"/></stop><stop offset="0.55" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#ec4899;#00e5ff;#8b5cf6" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#67e8f9"><animate attributeName="stop-color" values="#67e8f9;#00e5ff;#a78bfa;#67e8f9" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".09" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <ellipse cx="895" cy="95" rx="330" ry="240" fill="url(#glow)"/>
    <ellipse cx="120" cy="250" rx="250" ry="130" fill="url(#glow)"/>
    <g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".65">
      <path d="M0 64H90L115 89H185L208 66H280"/><path d="M1200 55H1095L1076 74H1025L1004 53H950"/>
      <path d="M0 230H72L91 211H160"/><path d="M1200 238H1115L1095 218H1030"/>
      <path d="M780 0V24L800 44H864"/><path d="M1020 300V270L1000 250H940"/>
    </g>
    <g fill="#67e8f9"><circle cx="90" cy="64" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/></circle><circle cx="1095" cy="55" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="72" cy="230" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle><circle cx="1115" cy="238" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.3s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(78 79)" stroke="url(#neon)" stroke-width="2.5" stroke-linejoin="round" fill="#0b2032" filter="url(#softGlow)">
      <path d="M48 0 91 25 91 75 48 100 5 75 5 25Z" fill-opacity=".56"/>
      <path d="M48 0V49L91 25M48 49 5 25M48 49V100" fill="none"/>
      <path d="M48 0 48 49 91 75 91 25Z" fill="#8b5cf6" fill-opacity=".16" stroke="none"/>
      <path d="M26 38 48 25 70 38 70 63 48 76 26 63Z" fill="none" stroke-width="1.4"/>
      <circle cx="48" cy="50" r="4" fill="#a5f3fc" stroke="none"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="215" y="126" fill="#eefaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="6">OPEN-SOURCE AI BUILDING BLOCKS</text>
    <text x="210" y="190" fill="url(#neon)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1">AIRegistry</text>
    <text x="215" y="228" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="1.1">INSTALL AI CAPABILITIES, NOT LIBRARIES.</text>
    <g transform="translate(215 252)"><rect width="136" height="25" rx="12.5" fill="#00d9ff" fill-opacity=".12" stroke="#00d9ff" stroke-opacity=".75"/><text x="68" y="17" text-anchor="middle" fill="#a5f3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SOURCE-FIRST</text><rect x="147" width="132" height="25" rx="12.5" fill="#8b5cf6" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".8"/><text x="213" y="17" text-anchor="middle" fill="#ddd6fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">VERSIONED</text><rect x="290" width="129" height="25" rx="12.5" fill="#22c55e" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".7"/><text x="354.5" y="17" text-anchor="middle" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">DEPENDENCY-FREE</text></g>
    <path d="M30 290H1170" stroke="url(#neon)" stroke-opacity=".65" stroke-width="2" stroke-dasharray="70 18 150 20"><animate attributeName="stroke-dashoffset" values="0;-258" dur="7s" repeatCount="indefinite"/></path>
    <rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="url(#neon)" stroke-opacity=".72" stroke-width="1.5"/>
  </g>
</svg>