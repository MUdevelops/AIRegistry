[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airegistry-cli"
version = "2.3.0"
description = "Dependency-free CLI for discovering and installing versioned AI components from AIRegistry"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "registry", "rag", "agents", "components", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://airegistry.instantregret96.workers.dev"
Repository = "https://github.com/MUdevelops/AIRegistry"
Issues = "https://github.com/MUdevelops/AIRegistry/issues"

[project.scripts]
ai = "ai:main"

[tool.setuptools]
py-modules = ["ai"]
